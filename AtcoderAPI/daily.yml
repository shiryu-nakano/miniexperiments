name: Daily AtCoder Unsolved Problem

on:
  schedule:
    # UTC 22:00 = JST 7:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick an unsolved problem
        id: pick
        run: python scripts/pick_problem.py
        env:
          # config.json に直接書きたくない場合は、リポジトリの Settings > Secrets and variables
          # に ATCODER_USER_ID を登録してここで上書きできる（未設定なら config.json の値を使う）
          ATCODER_USER_ID: ${{ secrets.ATCODER_USER_ID }}

      - name: Notify to Discord
        env:
          MESSAGE: ${{ steps.pick.outputs.message }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # ここは既存の「文字列をDiscordに通知する仕組み」に差し替えてください。
          # 参考実装（Webhookに直接投げる場合）:
          curl -sf -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,os;print(json.dumps({"content": os.environ["MESSAGE"]}))')" \
            "$DISCORD_WEBHOOK_URL"

      - name: Commit updated AC cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ac_cache.json
          git diff --cached --quiet || git commit -m "chore: update AC cache"
          git push
